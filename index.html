<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6d28d9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Marcação de Produção</title>
<style>
:root{--bg:#f6f2fb;--card:#fff;--p:#6d28d9;--p2:#8b5cf6;--soft:#f0e7ff;--text:#21182f;--muted:#746d7e;--border:#ece5f2;--green:#15803d;--red:#b91c1c;--blue:#2563eb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text);min-height:100vh}
button,input{font:inherit}.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:90px}
.top{background:linear-gradient(145deg,var(--p),var(--p2));color:#fff;padding:22px 20px 24px;border-radius:0 0 28px 28px}
.brand{font-size:22px;font-weight:800}.sub{font-size:13px;opacity:.86;margin-top:4px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.sum>div{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:14px}
.lbl{font-size:12px;opacity:.82}.val{font-size:22px;font-weight:800;margin-top:5px}
.content{padding:18px}.section{display:none}.section.active{display:block}.title{font-size:18px;font-weight:800;margin-bottom:12px}
.card{background:#fff;border:1px solid var(--border);border-radius:20px;padding:15px}
.datebox{margin-bottom:14px}.datebox label{display:block;font-size:13px;color:var(--muted);font-weight:700;margin-bottom:6px}.datewrap{border:1px solid var(--border);border-radius:14px;padding:11px 12px;background:#fff}.datewrap input{width:100%;border:0;background:transparent;padding:0;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.piece{background:#fff;border:1px solid var(--border);border-radius:18px;padding:14px}.name{font-weight:800}.price{font-size:12px;color:var(--muted);margin-top:3px}
.counter{display:flex;align-items:center;justify-content:space-between;margin-top:13px}.qty{font-size:28px;font-weight:800}.round{width:42px;height:42px;border-radius:14px;border:0;font-size:23px;font-weight:700}.minus{background:#f3eef8;color:var(--p)}.plus{background:var(--p);color:#fff}
.total{margin:15px 0;background:var(--soft);border-radius:18px;padding:15px}.row{display:flex;justify-content:space-between;gap:12px;margin:7px 0}.big{font-size:23px;font-weight:800;color:var(--p)}
.actions{display:grid;gap:10px;margin-top:14px}.btn{border:0;border-radius:16px;padding:14px;font-weight:800}.primary{background:var(--p);color:#fff}.soft{background:#fff;border:1px solid #d8ccfb;color:var(--p)}.share{background:var(--blue);color:#fff}.danger{background:#fee2e2;color:var(--red)}
.field{margin-bottom:12px}.field label{font-size:13px;color:var(--muted);font-weight:700;display:block;margin-bottom:6px}.field input{width:100%;border:1px solid var(--border);border-radius:14px;padding:13px}
.hist{display:grid;gap:10px}.item{background:#fff;border:1px solid var(--border);border-radius:17px;padding:13px}.itemtop{display:flex;justify-content:space-between;gap:10px}.money{font-weight:800;color:var(--green)}.detail{font-size:12px;color:var(--muted);line-height:1.55;margin-top:7px}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(520px,100%);display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border-top:1px solid var(--border);padding:9px 12px}.nav button{border:0;background:transparent;padding:8px;color:#8b8494;font-weight:800;font-size:12px}.nav button.active{color:var(--p)}
.install{margin-top:12px;display:none}
@media(max-width:380px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand">Marcação de Produção</div>
  <div class="sub">Controle de costura</div>
  <div class="sum">
    <div><div class="lbl">Peças</div><div class="val" id="sumPieces">0</div></div>
    <div><div class="lbl">A receber</div><div class="val" id="sumMoney">R$ 0,00</div></div>
  </div>
  <button id="installBtn" class="btn soft install" type="button">Adicionar aos aplicativos</button>
</header>

<main class="content">
<section id="prod" class="section active">
  <div class="title">Produção</div>
  <div class="datebox card">
    <label for="prodDate">Data da produção</label>
    <div class="datewrap"><input type="date" id="prodDate"></div>
  </div>
  <div id="pieces" class="grid"></div>
  <div class="total">
    <div class="row"><span>Total de peças</span><strong id="dayPieces">0</strong></div>
    <div class="row"><span>Pagamento</span><span class="big" id="dayMoney">R$ 0,00</span></div>
  </div>
  <div class="actions">
    <button id="saveBtn" class="btn primary" type="button">Salvar produção</button>
    <button id="resetBtn" class="btn soft" type="button">Zerar contagem</button>
  </div>
</section>

<section id="values" class="section">
  <div class="title">Valores por peça</div>
  <div id="valuesForm" class="card"></div>
  <div class="actions"><button id="saveValuesBtn" class="btn primary" type="button">Salvar valores</button></div>
</section>

<section id="history" class="section">
  <div class="title">Histórico</div>
  <div class="card">
    <div class="row"><span>Peças acumuladas</span><strong id="accPieces">0</strong></div>
    <div class="row"><span>Total acumulado</span><span class="big" id="accMoney">R$ 0,00</span></div>
  </div>
  <div class="actions">
    <button id="shareBtn" class="btn share" type="button">Compartilhar histórico</button>
  </div>
  <div id="hist" class="hist" style="margin-top:14px"></div>
</section>
</main>

<nav class="nav">
  <button class="active" data-tab="prod">Produção</button>
  <button data-tab="values">Valores</button>
  <button data-tab="history">Histórico</button>
</nav>
</div>

<script>
const TYPES=["Fundo","Trapiado","Inteira","Baguete","Grande"];
let values=JSON.parse(localStorage.getItem("mp_values")||"{}");
let today=JSON.parse(localStorage.getItem("mp_today")||"{}");
let history=JSON.parse(localStorage.getItem("mp_history")||"[]");
TYPES.forEach(t=>{if(values[t]===undefined)values[t]=0;if(today[t]===undefined)today[t]=0});

const $=id=>document.getElementById(id);
const money=v=>Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const totalPieces=o=>TYPES.reduce((s,t)=>s+(Number(o[t])||0),0);
const totalMoney=o=>TYPES.reduce((s,t)=>s+(Number(o[t])||0)*(Number(values[t])||0),0);

function render(){
  $("pieces").innerHTML=TYPES.map(t=>`<div class="piece"><div class="name">${t}</div><div class="price">${money(values[t])} por peça</div><div class="counter"><button class="round minus" data-t="${t}" data-d="-1">−</button><div class="qty">${today[t]}</div><button class="round plus" data-t="${t}" data-d="1">+</button></div></div>`).join("");
  $("valuesForm").innerHTML=TYPES.map(t=>`<div class="field"><label for="v_${t}">${t}</label><input id="v_${t}" type="number" min="0" step="0.01" value="${values[t]}"></div>`).join("");
  const tp=totalPieces(today), tm=totalMoney(today);
  $("sumPieces").textContent=tp;$("sumMoney").textContent=money(tm);$("dayPieces").textContent=tp;$("dayMoney").textContent=money(tm);
  const ap=history.reduce((s,r)=>s+Number(r.totalPecas||0),0), am=history.reduce((s,r)=>s+Number(r.totalPagamento||0),0);
  $("accPieces").textContent=ap;$("accMoney").textContent=money(am);
  $("hist").innerHTML=history.length?[...history].reverse().map((r,ri)=>{const i=history.length-1-ri;return `<div class="item"><div class="itemtop"><div><strong>${r.data}</strong><div class="detail">${r.totalPecas} peças</div></div><div style="text-align:right"><div class="money">${money(r.totalPagamento)}</div><button class="btn danger del" data-i="${i}" type="button" style="padding:7px 9px;margin-top:6px">Excluir</button></div></div><div class="detail">${TYPES.map(t=>`${t}: ${r.pecas[t]||0}`).join(" • ")}</div></div>`}).join(""):'<div class="item">Nenhuma produção salva ainda.</div>';
  bindDynamic();
}
function bindDynamic(){
  document.querySelectorAll("[data-t]").forEach(b=>b.addEventListener("click",()=>{const t=b.dataset.t,d=Number(b.dataset.d);today[t]=Math.max(0,(Number(today[t])||0)+d);localStorage.setItem("mp_today",JSON.stringify(today));render()}));
  document.querySelectorAll(".del").forEach(b=>b.addEventListener("click",()=>{history.splice(Number(b.dataset.i),1);localStorage.setItem("mp_history",JSON.stringify(history));render()}));
}
$("prodDate").value=new Date().toISOString().slice(0,10);
$("saveBtn").addEventListener("click",()=>{
  const tp=totalPieces(today); if(!tp){alert("Marque pelo menos uma peça.");return}
  const raw=$("prodDate").value; if(!raw){alert("Escolha a data.");return}
  const [y,m,d]=raw.split("-"); const br=`${d}/${m}/${y}`;
  history.push({data:br,pecas:{...today},totalPecas:tp,totalPagamento:totalMoney(today)});
  localStorage.setItem("mp_history",JSON.stringify(history));
  TYPES.forEach(t=>today[t]=0);localStorage.setItem("mp_today",JSON.stringify(today));render();alert("Produção salva.");
});
$("resetBtn").addEventListener("click",()=>{TYPES.forEach(t=>today[t]=0);localStorage.setItem("mp_today",JSON.stringify(today));render()});
$("saveValuesBtn").addEventListener("click",()=>{TYPES.forEach(t=>values[t]=Number($("v_"+t).value)||0);localStorage.setItem("mp_values",JSON.stringify(values));render();alert("Valores salvos.")});
document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));$(b.dataset.tab).classList.add("active")}));
$("shareBtn").addEventListener("click",async()=>{
  const text=["🧵 MARCAÇÃO DE PRODUÇÃO","",...history.flatMap(r=>[`📅 ${r.data}`,...TYPES.map(t=>`• ${t}: ${r.pecas[t]||0}`),`Total: ${r.totalPecas} peças`,`Pagamento: ${money(r.totalPagamento)}`,""]),`TOTAL GERAL: ${money(history.reduce((s,r)=>s+r.totalPagamento,0))}`].join("\n");
  if(navigator.share){try{await navigator.share({title:"Marcação de Produção",text});return}catch(e){}}
  alert(text);
});

let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;$("installBtn").style.display="block"});
$("installBtn").addEventListener("click",async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$("installBtn").style.display="none"});
if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").catch(()=>{})}
render();
</script>
</body>
</html>
